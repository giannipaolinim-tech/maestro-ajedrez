<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9ECE6">
<meta name="description" content="Lecciones, práctica guiada y exámenes con repetición espaciada para repertorios de aperturas.">
<title>Maestro · Aperturas de ajedrez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#E9ECE6;--surface:#F5F6F2;--ink:#1B2A22;--muted:#5C6A62;--line:#C9CFC6;--accent:#9C7419;--accent-ink:#FFFFFF;
 --sq-l:#DCE1CF;--sq-d:#7A977F;--hl:rgba(214,176,58,.55);--good:#2E6B45;--bad:#A23434;--hint:rgba(46,107,69,.45);
 --serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--surface:#1B231F;--ink:#E4E9E2;--muted:#9AA79F;--line:#2F3A34;--accent:#D4A640;--accent-ink:#1B1406;--sq-l:#B7C1AC;--sq-d:#587561;--good:#6FBF8B;--bad:#E07A7A;}}
:root[data-theme="dark"]{--bg:#121815;--surface:#1B231F;--ink:#E4E9E2;--muted:#9AA79F;--line:#2F3A34;--accent:#D4A640;--accent-ink:#1B1406;--sq-l:#B7C1AC;--sq-d:#587561;--good:#6FBF8B;--bad:#E07A7A;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:1060px;margin:0 auto;padding:16px 16px 40px}
/* home */
.home-h{padding:28px 0 20px}
.home-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chip{flex:none;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:6px 12px;margin-top:8px;white-space:nowrap;background:var(--surface)}
.home-h h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,14vw,104px);line-height:.9;letter-spacing:-.03em;margin:0}
.lede{font-family:var(--serif);font-size:19px;line-height:1.5;color:var(--muted);max-width:34em;margin:14px 0 0}
.catalog{margin-top:18px}
.op-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;max-width:520px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--sq-d);border-radius:4px;padding:18px 18px 16px}
.op-card.w{border-left-color:var(--sq-l);box-shadow:inset 1px 0 0 var(--line)}
.catalog{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.op-top{display:flex;justify-content:space-between;width:100%;align-items:baseline}
.op-name{font-family:var(--serif);font-size:clamp(22px,6vw,28px);line-height:1.15;font-weight:600;letter-spacing:-.01em}
.op-side{white-space:nowrap;flex:none;margin-left:10px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.op-moves{font-family:var(--serif);font-style:italic;font-size:18px}
.op-meta,.op-pct{font-size:14px;color:var(--muted)}
.op-pct{display:flex;justify-content:space-between;gap:10px;width:100%}
.due{color:var(--accent);font-weight:600}
.op-card{transition:border-color .15s,transform .1s}
.op-card:active{transform:scale(.99)}
@media (hover:hover){.op-card:hover{border-color:var(--muted)}}
.soon{font-size:14px;color:var(--muted);margin-top:14px}
.bar{display:block;width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar.sm{width:64px;height:4px;margin:0;flex:none}
/* opening */
.op-h{display:flex;gap:10px;align-items:center;padding:4px 0 10px}
.op-h h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;line-height:1.1}
.sub{font-size:13px;color:var(--muted)}
.back{font-size:30px;line-height:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin-left:-8px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3}
.tabs button{flex:1;padding:12px 4px 10px;font-weight:500;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.picker{max-width:640px}
.intro{font-family:var(--serif);font-size:17px;line-height:1.55;color:var(--muted);margin:0 0 14px}
.intro.strong{color:var(--ink)}
.picker h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:22px 0 2px;display:flex;justify-content:space-between;align-items:baseline}
.gd{font-size:14px;color:var(--muted);margin:0 0 8px}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 2px;border-bottom:1px solid var(--line)}
.line:hover .ln{text-decoration:underline;text-underline-offset:3px}
.line.all{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:6px}
.ln{font-weight:500}
.ld{font-size:14px;color:var(--muted)}
.lp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
/* study */
.study{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:860px){.study{grid-template-columns:minmax(0,560px) 1fr;align-items:start}}
.bwrap{width:100%;max-width:560px;margin:0 auto}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--line);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.board.live{touch-action:none;cursor:pointer}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;will-change:transform;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.sq.over::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.75);z-index:1}
.sq{position:relative;aspect-ratio:1}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq img{position:absolute;inset:4%;width:92%;height:92%;pointer-events:none}
.sq.last::before,.sq.sel::before,.sq.hint::before,.sq.good::before,.sq.bad::before{content:"";position:absolute;inset:0}
.sq.last::before{background:var(--hl)}
.sq.sel::before{background:rgba(214,176,58,.8)}
.sq.hint::before{box-shadow:inset 0 0 0 4px var(--good);background:var(--hint)}
.sq.good::before{background:rgba(46,107,69,.5)}
.sq.bad::before{background:rgba(162,52,52,.5);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.sq.bad::before{animation:none}.bar>span{transition:none}}
.dot{position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:rgba(27,42,34,.28)}
.cap{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 5px rgba(27,42,34,.3)}
.rk,.fl{position:absolute;font-style:normal;font-size:10px;font-weight:600;opacity:.75;pointer-events:none}
.rk{left:3px;top:2px}.fl{right:3px;bottom:1px}
.sq.l .rk,.sq.l .fl{color:#557060}.sq.d .rk,.sq.d .fl{color:#EEF2E8}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ctrl button{flex:1;height:46px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:17px}
.ctrl button.big{flex:2;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ctrl button:active:not(:disabled){transform:scale(.97)}
.ctrl button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:6px;flex:1}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.ko{background:var(--bad)}
.dots i.now{background:none;box-shadow:inset 0 0 0 2px var(--accent)}
.ctrl .prog{font-size:14px;color:var(--muted)}
.side{min-width:0}
.link{color:var(--muted);font-size:14px;padding:0;margin-bottom:6px}
.lt{font-family:var(--serif);font-weight:600;font-size:22px;margin:0;line-height:1.2}
.lsub{font-size:13px;color:var(--muted)}
.info{margin:12px 0;min-height:80px}
.said{margin:0 0 4px;font-size:15px}
.said b{font-family:var(--serif);font-size:21px}
.who{font-size:13px;color:var(--muted)}
.note{font-family:var(--serif);font-size:18px;line-height:1.55;margin:0;max-width:36em}
.note.quiet,.turn.quiet{color:var(--muted)}
.turn{font-weight:500;margin:0 0 8px}
.fb{font-family:var(--serif);font-size:17px;line-height:1.5;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface)}
.fb.good{border-left-color:var(--good)}.fb.bad{border-left-color:var(--bad)}
.plan{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.plan h4{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--muted)}
.plan p{font-family:var(--serif);font-size:17px;line-height:1.55;margin:0 0 12px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 20px;border-radius:4px;margin-top:10px;min-height:46px}
.primary:active,.ghost:active{transform:scale(.98)}
.ghost{border:1px solid var(--line);padding:10px 14px;border-radius:4px;background:var(--surface)}
.danger{color:var(--bad);margin-top:18px}
.exopts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.exopts .primary{margin-top:0}
.moves{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 4px;font-family:var(--serif);font-size:16px;padding-top:10px;border-top:1px solid var(--line);max-height:220px;overflow-y:auto}
.num{color:var(--muted);font-size:14px;margin-left:4px}
.mv{padding:2px 4px;border-radius:3px}
.mv.bm{font-weight:600}
.mv.cur{background:var(--accent);color:var(--accent-ink)}
.mv:disabled{cursor:default;opacity:1}
.score{font-size:48px!important;font-weight:400!important;margin:8px 0!important}
.review{margin:8px 0 14px}
.rv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.rv b{font-family:var(--serif);font-size:17px}
.rv.ok b{color:var(--good)}.rv.ko b{color:var(--bad)}
.big-m{display:flex;align-items:baseline;gap:12px;margin:6px 0 4px}
.bm-n{font-family:var(--serif);font-size:64px;line-height:1}
.bm-l{color:var(--muted)}
.gpct{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr 64px 40px 48px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.pn,.pe{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.credit{max-width:1060px;margin:0 auto;padding:0 16px 24px;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:6px;font-size:14px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
